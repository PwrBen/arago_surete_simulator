<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opération VIDOCQ - Arago Sûreté Simulator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            margin: 0; 
            padding: 0; 
        }
        header { 
            background-color: #1a252f; 
            color: white; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            border-bottom: 4px solid #e74c3c; 
        }
        .logo { 
            font-size: 2em; 
            font-weight: bold; 
            background: #e74c3c; 
            padding: 10px 15px; 
            border-radius: 5px; 
            margin-right: 20px; 
        }
        .header-titles h1 { margin: 0; font-size: 1.5em; }
        .header-titles h2 { margin: 0; font-weight: normal; font-size: 1.1em; color: #bdc3c7; }
        main { 
            max-width: 900px; 
            margin: 30px auto; 
            padding: 20px; 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-top: 20px; 
        }
        button { 
            cursor: pointer; 
            padding: 15px; 
            font-size: 1.1em; 
            border: none; 
            border-radius: 5px; 
            transition: 0.3s; 
        }
        .module-btn { background-color: #2c3e50; color: white; width: 100%; text-align: left;}
        .module-btn:hover { background-color: #34495e; transform: translateY(-2px); }
        .back-btn { background-color: #95a5a6; color: white; margin-top: 20px; width: 100%; }
        .back-btn:hover { background-color: #7f8c8d; }
        
        .choice-btn { 
            background-color: #ecf0f1; 
            color: #333; 
            display: block; 
            width: 100%; 
            text-align: left; 
            margin: 10px 0; 
            border: 1px solid #bdc3c7; 
        }
        .choice-btn:hover:not(:disabled) { background-color: #e0e6e8; }
        .choice-btn.selected { background-color: #3498db; color: white; border-color: #2980b9; }
        .choice-btn:disabled { cursor: not-allowed; opacity: 0.8; }
        .choice-btn.correct { background-color: #d4edda; border-color: #27ae60; color: #155724; }
        .choice-btn.wrong { background-color: #f8d7da; border-color: #c0392b; color: #721c24; }
        
        #dual-qcm-container { display: none; grid-template-columns: 1fr 1fr; gap: 20px; }
        .column-title { text-align: center; color: #2c3e50; font-size: 1.1em; border-bottom: 2px solid #bdc3c7; padding-bottom: 10px; margin-bottom: 15px;}
        
        #validate-btn { background-color: #f39c12; color: white; width: 100%; margin-top: 20px; display: none; font-weight: bold;}
        #validate-btn:hover { background-color: #e67e22; }

        #progress-bar {
            width: 100%;
            background-color: #ecf0f1;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
            height: 10px;
        }
        #progress-fill {
            height: 100%;
            background-color: #e74c3c;
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text { font-size: 0.9em; color: #7f8c8d; margin-bottom: 10px; font-weight: bold; }
        .feedback { 
            margin-top: 15px; 
            padding: 15px; 
            border-radius: 5px; 
            display: none;
            font-size: 1.05em;
            line-height: 1.4;
        }
        .feedback.active { display: block; }
        .feedback.success { background-color: #d4edda; color: #155724; border-left: 5px solid #27ae60;}
        .feedback.error { background-color: #f8d7da; color: #721c24; border-left: 5px solid #c0392b;}
        .feedback.partial { background-color: #fff3cd; color: #856404; border-left: 5px solid #ffeeba;}
        
        .next-btn { background-color: #2980b9; color: white; margin-top: 15px; width: 100%; display: none; }
        .next-btn.active { display: block; }
        .next-btn:hover { background-color: #3498db; }
        .score-display { font-size: 1.5em; text-align: center; margin: 20px 0; padding: 20px; background: #ecf0f1; border-radius: 8px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">S4</div>
        <div class="header-titles">
            <h1>Arago Sûreté Simulator</h1>
            <h2>Opération VIDOCQ</h2>
        </div>
    </header>
    <main>
        <!-- ECRAN D'ACCUEIL -->
        <div id="menu" class="screen active">
            <h3>Sélectionnez un module d'entraînement (10 situations par module)</h3>
            <div class="grid">
                <button class="module-btn" onclick="startModule('vidocq')">1. L'Œil de Vidocq (Observation)</button>
                <button class="module-btn" onclick="startModule('desc')">2. Simulateur DESC (Conflit)</button>
                <button class="module-btn" onclick="startModule('radio')">3. Radio Express (Com.)</button>
                <button class="module-btn" onclick="startModule('juridique')">4. L'Arène Juridique (Droit)</button>
                <button class="module-btn" onclick="startModule('rapport')" style="grid-column: span 2;">5. Chrono-Rapport (Rédaction)</button>
            </div>
        </div>

        <!-- ECRAN DU MODULE -->
        <div id="module" class="screen">
            <h3 id="module-title">Titre</h3>
            <div class="progress-text" id="progress-text">Question 1 / 10</div>
            <div id="progress-bar"><div id="progress-fill"></div></div>
            
            <div id="question-text" style="font-size: 1.1em; margin-bottom: 20px; font-weight: 500; background: #fdfefe; padding: 15px; border-left: 4px solid #34495e;"></div>
            
            <!-- CONTENEUR QCM SIMPLE (Modules 2 à 5) -->
            <div id="options-container" style="display:none;"></div>
            
            <!-- CONTENEUR QCM DOUBLE (Module 1) -->
            <div id="dual-qcm-container">
                <div>
                    <div class="column-title">1. Action à entreprendre</div>
                    <div id="options-action"></div>
                </div>
                <div>
                    <div class="column-title">2. Justification tactique/légale</div>
                    <div id="options-justif"></div>
                </div>
            </div>
            
            <button id="validate-btn" onclick="validateDual()">Valider ma décision</button>
            <div id="feedback-area" class="feedback"></div>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">Situation suivante</button>
            <button class="back-btn" onclick="goHome()">Quitter le module</button>
        </div>

        <!-- ECRAN DES RESULTATS -->
        <div id="result" class="screen">
            <h3>Module Terminé !</h3>
            <div id="score-display" class="score-display"></div>
            <p id="score-message" style="text-align: center; font-weight: bold;"></p>
            <button class="module-btn" onclick="goHome()">Retour au Menu Principal</button>
        </div>
    </main>

    <script>
        // BANQUE DE DONNEES DES MODULES
        const db = {
            vidocq: {
                title: "1. L'Œil de Vidocq",
                type: "dual",
                questions: [
                    { 
                        q: "Lors d'une ronde, vous remarquez une poubelle déplacée juste sous une fenêtre du rez-de-chaussée.", 
                        optionsAction: ["Ignorer l'anomalie.", "Replacer l'objet et signaler au PCS.", "Monter sur l'objet pour inspecter la fenêtre."], 
                        correctAction: 1, 
                        optionsJustif: ["C'est la responsabilité exclusive des agents d'entretien.", "C'est un outil facilitant l'intrusion par escalade.", "Le site est un point sensible nécessitant une inspection visuelle interne."], 
                        correctJustif: 1, 
                        explanation: "Méthode Vidocq : La poubelle sert de marchepied (faille environnementale). Il faut la replacer immédiatement et le signaler pour éviter l'approche." 
                    },
                    { 
                        q: "La porte du TGBT (Tableau Général Basse Tension) est ouverte sans présence technique.", 
                        optionsAction: ["Refermer et sécuriser la porte immédiatement.", "Rechercher le technicien dans le bâtiment.", "Fouiller le local pour vérifier les équipements."], 
                        correctAction: 0, 
                        optionsJustif: ["C'est un point dangereux (électrocution) et vulnérable (coupure générale).", "L'agent n'est pas habilité à manipuler les installations.", "Il s'agit d'une zone de flagrance potentielle."], 
                        correctJustif: 0, 
                        explanation: "Le TGBT concentre un double risque : humain (danger) et matériel (vulnérabilité du site). La sécurisation est la priorité." 
                    },
                    { 
                        q: "Un véhicule utilitaire banalisé stationne depuis 2 heures devant la sortie de secours.", 
                        optionsAction: ["Placer une contravention sur le pare-brise.", "Signaler l'immatriculation et demander une annonce micro.", "Déplacer le véhicule par vos propres moyens."], 
                        correctAction: 1, 
                        optionsJustif: ["C'est un stationnement sur voie publique.", "C'est une entrave à l'évacuation incendie et un repérage possible.", "Le véhicule doit être mis en fourrière immédiatement."], 
                        correctJustif: 1, 
                        explanation: "Un véhicule ventouse bloque la sécurité incendie et peut servir de moyen de fuite ou de repérage pour une équipe de malfaiteurs." 
                    },
                    { 
                        q: "Vous constatez que le grillage ouest est nettement découpé à la pince.", 
                        optionsAction: ["Mettre un panneau 'Attention Danger'.", "Réparation de fortune immédiate et ronde renforcée.", "Attendre la relève pour transmettre l'information."], 
                        correctAction: 1, 
                        optionsJustif: ["Préserver l'esthétique du site.", "Application de la règle des 3P (Prévision, Prévention, Protection).", "Le vandalisme relève de la procédure civile."], 
                        correctJustif: 1, 
                        explanation: "Une faille physique doit être comblée sans délai pour rétablir le périmètre de protection et prévenir l'intrusion." 
                    },
                    { 
                        q: "Vous trouvez un badge 'Visiteur' oublié sur un comptoir d'accueil.", 
                        optionsAction: ["Le jeter à la poubelle.", "Le récupérer et le faire désactiver informatiquement.", "Le laisser à sa place pour que le visiteur le retrouve."], 
                        correctAction: 1, 
                        optionsJustif: ["C'est une faille technique matérielle.", "C'est une faille humaine permettant une usurpation d'identité.", "Il n'y a aucun risque sur une zone d'accueil."], 
                        correctJustif: 1, 
                        explanation: "La faille sociale est souvent la première exploitée. Un badge libre donne un accès sans effraction à un intrus." 
                    },
                    { 
                        q: "La zone de stockage des palettes extérieures est plongée dans le noir total (lampadaire HS).", 
                        optionsAction: ["Continuer la ronde avec une lampe torche.", "Signaler la panne au PC Sécurité pour intervention technique.", "Éviter la zone pour des raisons de sécurité personnelle."], 
                        correctAction: 1, 
                        optionsJustif: ["L'obscurité annule la dissuasion et aveugle la vidéoprotection.", "Cela permet au site de faire des économies d'énergie.", "L'agent ne doit jamais opérer en zone non éclairée."], 
                        correctJustif: 0, 
                        explanation: "L'ombre favorise la phase 'd'approche' du malfaiteur et neutralise vos moyens techniques (caméras)." 
                    },
                    { 
                        q: "Un individu sur le trottoir photographie longuement vos caméras et vos barrières de filtrage.", 
                        optionsAction: ["Sortir du site pour l'appréhender physiquement.", "L'observer, noter son signalement et alerter la hiérarchie.", "Confisquer son appareil photo."], 
                        correctAction: 1, 
                        optionsJustif: ["L'individu est en situation de flagrant délit (Art. 53 CPP).", "C'est la phase de 'Préparation' (repérage) du cycle de la malveillance.", "Il porte atteinte à la vie privée des agents."], 
                        correctJustif: 1, 
                        explanation: "Tant qu'il est sur la voie publique, pas d'infraction flagrante. Mais détecter la préparation permet d'anticiper l'attaque." 
                    },
                    { 
                        q: "Une alarme incendie se déclenche de nuit dans un bâtiment vide et isolé du site.", 
                        optionsAction: ["Se rendre sur place en courant et défoncer la porte.", "Effectuer une levée de doute avec extrême prudence.", "Appeler le 18 (Pompiers) immédiatement sans vérifier."], 
                        correctAction: 1, 
                        optionsJustif: ["Le danger de mort est imminent (État de nécessité).", "Il y a un risque de ruse pour attirer l'agent (acte de malveillance).", "La procédure d'appel est automatique."], 
                        correctJustif: 1, 
                        explanation: "La ruse (déclencher une alarme pour vider un poste central ou piéger un agent) est classique. La levée de doute doit être tactique." 
                    },
                    { 
                        q: "Un sac de sport volumineux est abandonné sous un banc dans le hall d'accueil.", 
                        optionsAction: ["L'ouvrir pour identifier rapidement le propriétaire.", "Mettre en place un périmètre de sécurité et donner l'alerte.", "Le déplacer vers le bureau des objets trouvés."], 
                        correctAction: 1, 
                        optionsJustif: ["Procédure de gel des lieux (Colis suspect).", "C'est une vérification d'identité indirecte.", "Il faut dégager les voies de circulation."], 
                        correctJustif: 0, 
                        explanation: "Tout objet abandonné sans propriétaire identifiable doit être figé et traité comme une menace potentielle." 
                    },
                    { 
                        q: "Dans un couloir, une pile de cartons de livraison masque totalement un détecteur de mouvement volumétrique.", 
                        optionsAction: ["Déplacer les cartons pour libérer le champ de détection.", "Laisser les cartons en place.", "Éteindre le détecteur pour éviter les fausses alarmes."], 
                        correctAction: 0, 
                        optionsJustif: ["Maintenir l'esthétisme des lieux.", "Un dispositif masqué est une faille rendant le système aveugle.", "C'est la responsabilité des magasiniers."], 
                        correctJustif: 1, 
                        explanation: "L'agent de sûreté doit garantir l'opérabilité de son dispositif de défense. Une alarme masquée ne sert à rien." 
                    }
                ]
            },
            desc: {
                title: "2. Simulateur DESC",
                type: "single",
                questions: [
                    { q: "Un visiteur force le passage sans badge. (Module DESC en cours de révision - Question de test)", options: ["L'insulter", "Appliquer le DESC"], correct: 1, explanation: "Rappel des règles de communication." }
                ]
            },
            radio: {
                title: "3. Radio Express",
                type: "single",
                questions: [
                    { q: "Comment dire 5 en radio ? (Module Radio en cours de révision - Question de test)", options: ["Cinq", "3 et 2"], correct: 1, explanation: "Code chiffré." }
                ]
            },
            juridique: {
                title: "4. L'Arène Juridique",
                type: "single",
                questions: [
                    { q: "L'article 73 concerne : (Module Juridique en cours de révision - Question de test)", options: ["La palpation", "L'appréhension"], correct: 1, explanation: "Délit flagrant." }
                ]
            },
            rapport: {
                title: "5. Chrono-Rapport",
                type: "single",
                questions: [
                    { q: "Un rapport doit être : (Module Rapport en cours de révision - Question de test)", options: ["Imaginatif", "Factuel"], correct: 1, explanation: "Les faits, rien que les faits." }
                ]
            }
        };

        // VARIABLES GLOBALES
        let currentModuleId = "";
        let currentQuestionIndex = 0;
        let score = 0;
        let selectionDual = { action: null, justif: null, actionBtn: null, justifBtn: null };

        function startModule(moduleId) {
            currentModuleId = moduleId;
            currentQuestionIndex = 0;
            score = 0;
            
            document.getElementById('menu').classList.remove('active');
            document.getElementById('result').classList.remove('active');
            document.getElementById('module').classList.add('active');
            
            document.getElementById('module-title').innerText = db[moduleId].title;
            
            loadQuestion();
        }

        function loadQuestion() {
            const module = db[currentModuleId];
            const qData = module.questions[currentQuestionIndex];
            
            // Progression
            document.getElementById('progress-text').innerText = `Situation ${currentQuestionIndex + 1} / ${module.questions.length}`;
            const progressPercent = ((currentQuestionIndex) / module.questions.length) * 100;
            document.getElementById('progress-fill').style.width = `${progressPercent}%`;
            
            // Texte
            document.getElementById('question-text').innerText = qData.q;
            
            // Réinitialiser UI
            document.getElementById('feedback-area').classList.remove('active', 'success', 'error', 'partial');
            document.getElementById('next-btn').classList.remove('active');
            
            if (module.type === "dual") {
                document.getElementById('options-container').style.display = 'none';
                document.getElementById('dual-qcm-container').style.display = 'grid';
                document.getElementById('validate-btn').style.display = 'block';
                document.getElementById('validate-btn').disabled = true;
                document.getElementById('validate-btn').style.opacity = '0.5';
                
                selectionDual = { action: null, justif: null, actionBtn: null, justifBtn: null };
                
                // Remplir Colonne Action
                const actionContainer = document.getElementById('options-action');
                actionContainer.innerHTML = '';
                qData.optionsAction.forEach((optText, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = optText;
                    btn.onclick = () => selectDual('action', index, btn);
                    actionContainer.appendChild(btn);
                });
                
                // Remplir Colonne Justification
                const justifContainer = document.getElementById('options-justif');
                justifContainer.innerHTML = '';
                qData.optionsJustif.forEach((optText, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = optText;
                    btn.onclick = () => selectDual('justif', index, btn);
                    justifContainer.appendChild(btn);
                });
                
            } else {
                // Logique pour les QCM simples (Modules 2 à 5)
                document.getElementById('options-container').style.display = 'block';
                document.getElementById('dual-qcm-container').style.display = 'none';
                document.getElementById('validate-btn').style.display = 'none';
                
                const optionsContainer = document.getElementById('options-container');
                optionsContainer.innerHTML = '';
                qData.options.forEach((optText, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = optText;
                    btn.onclick = () => handleSingleAnswer(index, btn);
                    optionsContainer.appendChild(btn);
                });
            }
        }

        function selectDual(type, index, btn) {
            const container = document.getElementById(type === 'action' ? 'options-action' : 'options-justif');
            const btns = container.querySelectorAll('.choice-btn');
            btns.forEach(b => b.classList.remove('selected'));
            
            btn.classList.add('selected');
            selectionDual[type] = index;
            selectionDual[type + 'Btn'] = btn;
            
            // Activer le bouton de validation si les deux sont choisis
            if (selectionDual.action !== null && selectionDual.justif !== null) {
                document.getElementById('validate-btn').disabled = false;
                document.getElementById('validate-btn').style.opacity = '1';
            }
        }

        function validateDual() {
            document.getElementById('validate-btn').style.display = 'none';
            const module = db[currentModuleId];
            const qData = module.questions[currentQuestionIndex];
            
            const isActionCorrect = (selectionDual.action === qData.correctAction);
            const isJustifCorrect = (selectionDual.justif === qData.correctJustif);
            
            // Bloquer les boutons
            const allBtns = document.querySelectorAll('#dual-qcm-container .choice-btn');
            allBtns.forEach(b => b.disabled = true);
            
            // Coloration Action
            const actionBtns = document.getElementById('options-action').querySelectorAll('.choice-btn');
            actionBtns[qData.correctAction].classList.add('correct');
            if (!isActionCorrect) selectionDual.actionBtn.classList.add('wrong');
            
            // Coloration Justification
            const justifBtns = document.getElementById('options-justif').querySelectorAll('.choice-btn');
            justifBtns[qData.correctJustif].classList.add('correct');
            if (!isJustifCorrect) selectionDual.justifBtn.classList.add('wrong');
            
            // Calcul du score et Feedback
            const fb = document.getElementById('feedback-area');
            fb.classList.remove('success', 'error', 'partial');
            
            if (isActionCorrect && isJustifCorrect) {
                score++;
                fb.classList.add('active', 'success');
                fb.innerHTML = `<strong>✓ OPÉRATION VALIDÉE</strong><br>${qData.explanation}`;
            } else if (isActionCorrect || isJustifCorrect) {
                score += 0.5; // Demi point
                fb.classList.add('active', 'partial');
                fb.innerHTML = `<strong>⚠ ANALYSE PARTIELLE (0.5 pt)</strong><br>L'action ou la justification était incorrecte. <br><br><em>Rappel :</em> ${qData.explanation}`;
            } else {
                fb.classList.add('active', 'error');
                fb.innerHTML = `<strong>✗ ÉCHEC TACTIQUE</strong><br>${qData.explanation}`;
            }
            
            setupNextButton();
        }

        function handleSingleAnswer(selectedIndex, clickedBtn) {
            const module = db[currentModuleId];
            const qData = module.questions[currentQuestionIndex];
            const isCorrect = (selectedIndex === qData.correct);
            
            const allBtns = document.querySelectorAll('#options-container .choice-btn');
            allBtns.forEach((btn, index) => {
                btn.disabled = true;
                if (index === qData.correct) {
                    btn.classList.add('correct'); 
                } else if (index === selectedIndex && !isCorrect) {
                    btn.classList.add('wrong'); 
                }
            });
            
            if (isCorrect) score++;
            
            const fb = document.getElementById('feedback-area');
            fb.classList.remove('success', 'error', 'partial');
            fb.classList.add('active', isCorrect ? 'success' : 'error');
            fb.innerHTML = `<strong>${isCorrect ? '✓ CORRECT' : '✗ FAUX'}</strong><br>${qData.explanation}`;
            
            setupNextButton();
        }

        function setupNextButton() {
            const module = db[currentModuleId];
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.add('active');
            
            if (currentQuestionIndex === module.questions.length - 1) {
                document.getElementById('progress-fill').style.width = `100%`;
                nextBtn.innerText = "Voir le débriefing de mission";
            } else {
                nextBtn.innerText = "Situation suivante";
            }
        }

        function nextQuestion() {
            const module = db[currentModuleId];
            currentQuestionIndex++;
            
            if (currentQuestionIndex < module.questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('module').classList.remove('active');
            document.getElementById('result').classList.add('active');
            
            const total = db[currentModuleId].questions.length;
            const scoreDisplay = document.getElementById('score-display');
            const scoreMessage = document.getElementById('score-message');
            
            scoreDisplay.innerText = `Évaluation : ${score} / ${total}`;
            
            if (score === total) {
                scoreDisplay.style.color = "#27ae60";
                scoreMessage.innerText = "Excellent ! Discernement et rigueur juridique parfaits. Vous êtes digne de votre carte professionnelle.";
            } else if (score >= total * 0.7) {
                scoreDisplay.style.color = "#d35400";
                scoreMessage.innerText = "Opérationnel. Votre instinct est bon, mais quelques failles persistent. Un passage par le manuel s'impose.";
            } else {
                scoreDisplay.style.color = "#c0392b";
                scoreMessage.innerText = "Vos erreurs tactiques ou juridiques engagent votre responsabilité. Vous n'êtes pas prêt pour le terrain. Reprenez vos cours depuis le début.";
            }
        }

        function goHome() {
            document.getElementById('module').classList.remove('active');
            document.getElementById('result').classList.remove('active');
            document.getElementById('menu').classList.add('active');
        }
    </script>
</body>
</html>
